<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMO City</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="join">
    <h1>MMO City</h1>
    <input id="nameInput" maxlength="16" data-i18n-ph="join.nickPh" />
    <div class="roles">
      <button id="joinCitizen" data-i18n="join.citizen"></button>
      <button id="joinCop" data-i18n="join.cop"></button>
    </div>
    <div class="roles">
      <button id="langRu">RU</button>
      <button id="langEn">EN</button>
    </div>
    <div id="joinError"></div>
  </div>

  <div id="hud" class="hidden">
    <div id="hpbar"><div id="hpfill"></div><span id="hptext"></span></div>
    <div id="ammoBig" class="hidden"></div>
    <div id="stats"></div>
    <div id="banner" class="hidden"></div>
    <div id="prompt"></div>
    <div id="safeDialog" class="hidden">
      <div data-i18n="dialog.safe"></div>
      <button id="dep100">+100</button>
      <button id="depAll" data-i18n="dialog.depAll"></button>
      <button id="wd100">−100</button>
      <button id="wdAll" data-i18n="dialog.wdAll"></button>
      <button id="safeClose" data-i18n="dialog.close"></button>
    </div>
    <div id="shopDialog" class="hidden">
      <div data-i18n="dialog.shop"></div>
      <div id="shopItems"></div>
      <button id="buyAmmoBtn"></button>
      <button id="shopClose" data-i18n="dialog.close"></button>
    </div>
    <div id="toast" class="hidden"></div>
    <div id="feed"></div>
    <div id="chat"></div>
    <input id="chatInput" class="hidden" data-i18n-ph="chat.ph" />
    <div id="crosshair" class="hidden"></div>
    <canvas id="minimap" width="200" height="200"></canvas>
    <canvas id="fullmap" class="hidden"></canvas>
    <div id="phoneHint"><span data-i18n="phone.hint"></span> <span id="smsBadge" class="badge hidden"></span></div>
    <div id="phone" class="hidden">
      <div id="phoneHome">
        <div id="phoneClock">--:--</div>
        <button class="phoneApp" data-app="sms"><span data-i18n="phone.sms"></span> <span id="phoneSmsBadge" class="badge hidden"></span></button>
        <button class="phoneApp" data-app="bank" data-i18n="phone.bank"></button>
        <button class="phoneApp" data-app="job" data-i18n="phone.job"></button>
        <button class="phoneApp" data-app="top" data-i18n="phone.top"></button>
      </div>
      <div id="appSms" class="phoneScreen hidden">
        <div class="phoneBar"><button class="phoneBack">←</button><span data-i18n="phone.sms"></span><button id="smsNew">+</button></div>
        <div id="smsNewForm" class="hidden">
          <input id="smsNewTo" maxlength="16" data-i18n-ph="sms.toPh" /><button id="smsNewGo">→</button>
        </div>
        <div id="smsDialogs"></div>
      </div>
      <div id="appThread" class="phoneScreen hidden">
        <div class="phoneBar"><button class="phoneBack">←</button><span id="threadTitle"></span></div>
        <div id="threadMsgs"></div>
        <div id="threadForm"><input id="threadInput" maxlength="140" data-i18n-ph="sms.ph" /><button id="threadSend">→</button></div>
      </div>
      <div id="appBank" class="phoneScreen hidden">
        <div class="phoneBar"><button class="phoneBack">←</button><span data-i18n="phone.bank"></span></div>
        <div id="bankBalance"></div>
        <div id="transferForm">
          <input id="transferTo" maxlength="16" data-i18n-ph="bank.toPh" />
          <input id="transferAmount" inputmode="numeric" data-i18n-ph="bank.sumPh" />
          <button id="transferBtn" data-i18n="bank.transfer"></button>
        </div>
        <div id="transferList"></div>
      </div>
      <div id="appJob" class="phoneScreen hidden">
        <div class="phoneBar"><button class="phoneBack">←</button><span data-i18n="phone.job"></span></div>
        <div id="jobInfo"></div>
        <button id="jobBtn"></button>
      </div>
      <div id="appTop" class="phoneScreen hidden">
        <div class="phoneBar"><button class="phoneBack">←</button><span data-i18n="phone.top"></span></div>
        <div id="topList"></div>
      </div>
    </div>
    <div id="vignette" class="hidden"></div>
    <div id="deathOverlay" class="hidden">
      <div id="deathTitle" data-i18n="death.title"></div>
      <div id="deathTimer"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
