<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMO City</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="join">
    <h1>MMO City</h1>
    <input id="nameInput" maxlength="16" placeholder="Ник" />
    <div class="roles">
      <button id="joinCitizen">Гражданин</button>
      <button id="joinCop">Полицейский</button>
    </div>
    <div id="joinError"></div>
  </div>

  <div id="hud" class="hidden">
    <div id="hpbar"><div id="hpfill"></div><span id="hptext"></span></div>
    <div id="ammoBig" class="hidden"></div>
    <div id="stats"></div>
    <div id="banner" class="hidden"></div>
    <div id="prompt"></div>
    <div id="safeDialog" class="hidden">
      <div>Сейф</div>
      <button id="dep100">+100</button>
      <button id="depAll">Всё</button>
      <button id="wd100">−100</button>
      <button id="wdAll">Снять всё</button>
      <button id="safeClose">Закрыть</button>
    </div>
    <div id="shopDialog" class="hidden">
      <div>Оружейный магазин</div>
      <div id="shopItems"></div>
      <button id="buyAmmoBtn">Патроны +30 (100$)</button>
      <button id="shopClose">Закрыть</button>
    </div>
    <div id="toast" class="hidden"></div>
    <div id="feed"></div>
    <div id="chat"></div>
    <input id="chatInput" class="hidden" placeholder="Сообщение… (Enter — отправить, Esc — отмена)" />
    <div id="crosshair" class="hidden"></div>
    <canvas id="minimap" width="200" height="200"></canvas>
    <canvas id="fullmap" class="hidden"></canvas>
    <div id="phoneHint">P — телефон <span id="smsBadge" class="badge hidden"></span></div>
    <div id="phone" class="hidden">
      <div id="phoneHome">
        <div id="phoneClock">--:--</div>
        <button class="phoneApp" data-app="sms">SMS <span id="phoneSmsBadge" class="badge hidden"></span></button>
        <button class="phoneApp" data-app="bank">Банк</button>
        <button class="phoneApp" data-app="job">Работа</button>
      </div>
      <div id="appSms" class="phoneScreen hidden">
        <div class="phoneBar"><button class="phoneBack">←</button><span>SMS</span><button id="smsNew">+</button></div>
        <div id="smsNewForm" class="hidden">
          <input id="smsNewTo" maxlength="16" placeholder="Ник получателя" /><button id="smsNewGo">→</button>
        </div>
        <div id="smsDialogs"></div>
      </div>
      <div id="appThread" class="phoneScreen hidden">
        <div class="phoneBar"><button class="phoneBack">←</button><span id="threadTitle"></span></div>
        <div id="threadMsgs"></div>
        <div id="threadForm"><input id="threadInput" maxlength="140" placeholder="SMS…" /><button id="threadSend">→</button></div>
      </div>
      <div id="appBank" class="phoneScreen hidden">
        <div class="phoneBar"><button class="phoneBack">←</button><span>Банк</span></div>
        <div id="bankBalance"></div>
        <div id="transferForm">
          <input id="transferTo" maxlength="16" placeholder="Ник" />
          <input id="transferAmount" inputmode="numeric" placeholder="Сумма" />
          <button id="transferBtn">Перевести</button>
        </div>
        <div id="transferList"></div>
      </div>
      <div id="appJob" class="phoneScreen hidden">
        <div class="phoneBar"><button class="phoneBack">←</button><span>Работа</span></div>
        <div id="jobInfo"></div>
        <button id="jobBtn"></button>
      </div>
    </div>
    <div id="vignette" class="hidden"></div>
    <div id="deathOverlay" class="hidden">
      <div id="deathTitle">Вы погибли</div>
      <div id="deathTimer"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
