# MMO City — прод-стек: traefik (TLS сам, WS-роутинг) + web (статика) + server (игра).
# Запуск: cd deploy/docker && docker compose up -d --build
# Конфигурация — .env (DOMAIN, ADMIN_TOKEN, ACME_EMAIL), см. .env.example.
services:
  traefik:
    image: traefik:v3
    container_name: mmo-traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # ACME (Let's Encrypt): выпуск и продление сами, хранилище на хосте
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/mmo/letsencrypt:/letsencrypt
    restart: always

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/nginx.Dockerfile
    container_name: mmo-web
    labels:
      - traefik.enable=true
      # статика клиента + админка — всё, что не ушло в api/ws ниже
      - traefik.http.routers.web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=80
    restart: always

  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: mmo-server
    env_file: .env
    environment:
      GAME_DB: /data/game.db
      PORT: 2567
    volumes:
      - /srv/mmo/data:/data # game.db — на хосте, удобно бэкапить
    ports:
      - "127.0.0.1:2567:2567" # только localhost: healthz и админ-туннель
    labels:
      - traefik.enable=true
      # colyseus: matchmake POST'ы и служебные пути
      - traefik.http.routers.api.rule=Host(`${DOMAIN}`) && (PathPrefix(`/matchmake`) || PathPrefix(`/healthz`) || PathPrefix(`/admin/api`))
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.routers.api.priority=100
      # WebSocket-соединение игры (Upgrade: websocket на любом пути)
      - traefik.http.routers.ws.rule=Host(`${DOMAIN}`) && Header(`Upgrade`, `websocket`)
      - traefik.http.routers.ws.entrypoints=websecure
      - traefik.http.routers.ws.tls.certresolver=letsencrypt
      - traefik.http.routers.ws.priority=100
      - traefik.http.services.server.loadbalancer.server.port=2567
    restart: always
