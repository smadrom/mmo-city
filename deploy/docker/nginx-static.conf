# Только статика (traefik снаружи делает TLS и роутинг на игровой сервер)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # админка — статика из образа
    location /admin/ {
        alias /usr/share/nginx/admin/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
